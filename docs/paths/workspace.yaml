    operationId: skipCustomer
    security:
      - bearerAuth: []
    parameters:
      - name: ticketId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ObjectId"
    responses:
      "200":
        description: Customer skipped.
        content:
          application/json:
            schema:
              type: object
              required: [success, message, data]
              properties:
                success: { type: boolean, enum: [true] }
                message: { type: string, example: "Customer skipped successfully" }
                data:
                  type: object
                  required: [ticket]
                  properties:
                    ticket:
                      $ref: "#/components/schemas/TicketActionResult"
            example:
              success: true
              message: "Customer skipped successfully"
              data:
                ticket:
                  id: "665f1c2ab8f4e21d3c9a7b11"
                  ticketNumber: "A102"
                  status: "SKIPPED"
      "400":
        $ref: "#/components/responses/ValidationError"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "403":
        $ref: "#/components/responses/Forbidden"
      "404":
        $ref: "#/components/responses/NotFound"
      "409":
        $ref: "#/components/responses/Conflict"
      "429":
        $ref: "#/components/responses/TooManyRequests"
      "500":
        $ref: "#/components/responses/InternalServerError"

/workspace/tickets/{ticketId}/cancel:
  patch:
    tags: [Workspace]
    summary: Cancel the current service (SERVING -> CANCELLED)
    description: EMPLOYEE only. The ticket must be SERVING and called by the same employee (403 otherwise).
    operationId: cancelService
    security:
      - bearerAuth: []
    parameters:
      - name: ticketId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ObjectId"
    responses:
      "200":
        description: Service cancelled.
        content:
          application/json:
            schema:
              type: object
              required: [success, message, data]
              properties:
                success: { type: boolean, enum: [true] }
                message: { type: string, example: "Service cancelled successfully" }
                data:
                  type: object
                  required: [ticket]
                  properties:
                    ticket:
                      $ref: "#/components/schemas/TicketActionResult"
            example:
              success: true
              message: "Service cancelled successfully"
              data:
                ticket:
                  id: "665f1c2ab8f4e21d3c9a7b11"
                  ticketNumber: "A102"
                  status: "CANCELLED"
      "400":
        $ref: "#/components/responses/ValidationError"
      "401":
        $ref: "#/components/responses/Unauthorized"
      "403":
        $ref: "#/components/responses/Forbidden"
      "404":
        $ref: "#/components/responses/NotFound"
      "409":
        $ref: "#/components/responses/Conflict"
      "429":
        $ref: "#/components/responses/TooManyRequests"
      "500":
        $ref: "#/components/responses/InternalServerError"
